compliance_enforcement_task:
  description: >
    Review the structured payload generated by the triage task.
    Execute a strict statutory audit using the structured payload received from the triage task.
    You will only execute if 'is_sufficiently_narrow' was validated as true.
    
    If 'is_sufficiently_narrow' is true, execute the following processing cycle:
    1. EXTRACT AND SEARCH: Read the 'generated_subqueries' array. Pass these strings directly into your 
       vector search tools to pull relevant legal text chunks from the database.
    2. STATUTORY AUDIT: Assess each claim in 'agent_1_assumptions' against the retrieved text chunks. Verify 
       compliance thresholds, fines, exceptions, and risk tiers (Prohibited, High-Risk, Limited, Minimal).
    3. FILTER CLAIMS: Identify any assumptions that are legally inaccurate, misaligned with statutory definitions, 
       or unsupported by the text. Place them into the 'discarded_assumptions' array and strip their logic 
       completely from your final response generation.
    4. RESPOND WITH CONDITIONALS: If any compliance pillars were flagged as unknown or assumed, encapsulate 
       those segments of your analysis inside highly visible Markdown "IF/THEN" blocks.
    5. TAILOR THE OUTPUT: Synthesize the verified statutory requirements into a practical compliance roadmap 
       formatted in clean Markdown. You MUST read the 'audience_profile' data passed from Task 1:
       - If 'technical_tier' is Non-Technical, strip away software architecture jargon. Focus your 
         explanations on operational checklists, user-facing disclosure forms, and standard workplace policies.
       - If 'technical_tier' is Technical, frame the compliance obligations around data pipeline governance, 
         logging architectures, system telemetry, and technical documentation schemas.
       Match the tone specifically to the 'organizational_role' (e.g., an individual teacher needs guidance on 
       safe daily software use, whereas a CEO or Product Owner needs high-level liability overviews, organizational risk 
       registers, and corporate governance actions).
  expected_output: >
    A strictly structured JSON string matching this schema:
    {
      "final_compliance_answer": "string",
      "discarded_assumptions": ["string1", "string2"]
    }
  agent: compliance_enforcer